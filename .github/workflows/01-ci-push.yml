# Pipeline executada quando um push e enviado ao repositorio.
name: 01 - Testes no push

on:
  push:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes e gerar relatorio
        run: npx mocha --reporter mochawesome

      - name: Armazenar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-push
          path: mochawesome-report
          retention-days: 30
